name: WildcatVerify
options:
  bundleIdPrefix: edu.northwestern.lookagain
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  WildcatVerify:
    type: application
    platform: iOS
    sources:
      - WildcatVerify
    dependencies:
      - target: WildcatVerifyShare
      - target: WildcatVerifyAction
      - target: WildcatVerifyControls
    info:
      path: WildcatVerify/Info.plist
      properties:
        # wildcatverify:// links for the Control Center and Lock Screen controls.
        CFBundleURLTypes:
          - CFBundleURLName: edu.northwestern.lookagain.WildcatVerify
            CFBundleURLSchemes: [wildcatverify]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: edu.northwestern.lookagain.WildcatVerify
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: WildcatVerify
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # Only HTTPS (via URLSession) and CryptoKit hashing: exempt from export filings.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: YES
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        ENABLE_PREVIEWS: YES
  # Share sheet: "WildcatVerify" in other apps' share menus. Runs the same
  # CheckPipeline and Results screen as the app, in memory only.
  WildcatVerifyShare:
    type: app-extension
    platform: iOS
    sources:
      - WildcatVerifyShare
      - WildcatVerify/Models
      - WildcatVerify/Services
      - WildcatVerify/Share
      - WildcatVerify/Theme
      - WildcatVerify/Views/Shared
      - WildcatVerify/Views/Results
      - WildcatVerify/Views/Check/AnalyzingView.swift
      - WildcatVerify/ViewModels/CheckResultsViewModel.swift
      - WildcatVerify/ViewModels/PhotoLayer.swift
      - WildcatVerify/Resources/Assets.xcassets
    info:
      path: WildcatVerifyShare/Info.plist
      properties:
        CFBundleDisplayName: WildcatVerify
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 1
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: edu.northwestern.lookagain.WildcatVerify.Share
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) SHARE_EXTENSION"
        APPLICATION_EXTENSION_API_ONLY: YES
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: YES
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  # "Check with WildcatVerify" in the share menu's action list (press and hold
  # an image in Bluesky, Safari, Photos or Messages → Share). Same code and
  # memory-only rules as the share extension; listed as an action, not an app.
  WildcatVerifyAction:
    type: app-extension
    platform: iOS
    sources:
      - WildcatVerifyShare/ShareViewController.swift
      - WildcatVerifyAction
      - WildcatVerify/Models
      - WildcatVerify/Services
      - WildcatVerify/Share
      - WildcatVerify/Theme
      - WildcatVerify/Views/Shared
      - WildcatVerify/Views/Results
      - WildcatVerify/Views/Check/AnalyzingView.swift
      - WildcatVerify/ViewModels/CheckResultsViewModel.swift
      - WildcatVerify/ViewModels/PhotoLayer.swift
      - WildcatVerify/Resources/Assets.xcassets
    info:
      path: WildcatVerifyAction/Info.plist
      properties:
        CFBundleDisplayName: Check with WildcatVerify
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ui-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 1
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: edu.northwestern.lookagain.WildcatVerify.Action
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) SHARE_EXTENSION"
        APPLICATION_EXTENSION_API_ONLY: YES
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: YES
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  # Control Center, Lock Screen and Action Button controls (iOS 18). They only
  # open wildcatverify:// links, so the extension carries no app code.
  WildcatVerifyControls:
    type: app-extension
    platform: iOS
    sources:
      - WildcatVerifyControls
      - WildcatVerify/Models/AppDeepLink.swift
    info:
      path: WildcatVerifyControls/Info.plist
      properties:
        CFBundleDisplayName: WildcatVerify
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: edu.northwestern.lookagain.WildcatVerify.Controls
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
        GENERATE_INFOPLIST_FILE: YES
  WildcatVerifyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - WildcatVerifyTests
    dependencies:
      - target: WildcatVerify
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: edu.northwestern.lookagain.WildcatVerifyTests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
  WildcatVerifyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - WildcatVerifyUITests
    dependencies:
      - target: WildcatVerify
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: edu.northwestern.lookagain.WildcatVerifyUITests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        TEST_TARGET_NAME: WildcatVerify
schemes:
  WildcatVerify:
    build:
      targets:
        WildcatVerify: all
        WildcatVerifyTests: [test]
        WildcatVerifyUITests: [test]
    test:
      targets:
        - WildcatVerifyTests
        - WildcatVerifyUITests
