[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "look-again"
version = "0.1.0"
description = "Research code for image and video forgery detection"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "datasets>=5.0.1",
    "huggingface-hub>=1.33.0",
    "joblib>=1.4.0",
    "librosa>=0.11.0",
    "matplotlib>=3.11.2",
    "numpy>=2.0.0",
    "opencv-python-headless>=4.10.0,<5",
    "pandas>=2.2.0",
    "pillow>=12.3.0",
    "pyarrow>=18.0.0",
    "scikit-image>=0.25.0",
    "scikit-learn>=1.6.0",
    "seaborn>=0.13.2",
    "scipy>=1.14.0",
    "soundfile>=0.13.0",
    "timm>=1.0.30",
    "tqdm>=4.67.0",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "transformers>=4.46.0",
]

[project.optional-dependencies]
xgboost = ["xgboost>=2.1.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["look_again*"]
